<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="t d"><title id="t">Observer: all sides, production and disclosed agent summaries</title><desc id="d">An omniscient observer battlefield with perspective switcher, side summaries, production and army tabs, and read-only disclosed agent commentary. Public delay is visible and applies to all panels.</desc><defs><style>text{font-family:system-ui,sans-serif;fill:#f5e6cc;font-size:16px}.muted{fill:#beae98;font-size:14px}.gold{fill:#e3b65f}.blue{fill:#95c9ee}.red{fill:#f7a8a2}.panel{fill:#231c20;fill-opacity:.93;stroke:#755b3f}.control{fill:#362a29;stroke:#9a794b}.heading{font-size:21px;font-weight:650}.small{font-size:13px}</style><linearGradient id="terrain" x2="0" y2="1"><stop stop-color="#3e463c"/><stop offset="1" stop-color="#202724"/></linearGradient></defs>
