<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="t d"><title id="t">Commanders are my connections, independent of sides</title><desc id="d">A roster of named live agents and policies with model/provider badges, compatible roles, connection and readiness status, setup and security controls. No team assignments live here.</desc><defs><style>text{font-family:system-ui,sans-serif;fill:#f5e6cc;font-size:16px}.muted{fill:#beae98;font-size:14px}.gold{fill:#e3b65f}.heading{font-size:24px;font-weight:650}.panel{fill:#231c20;fill-opacity:.94;stroke:#755b3f}.control{fill:#362a29;stroke:#9a794b}.good{fill:#accca7}.small{font-size:13px}</style></defs><rect width="1280" height="760" fill="#141418"/><text x="30" y="45" class="heading gold">AGENT COMMAND</text><text x="388" y="45" class="muted">Play</text><text x="463" y="45" class="muted">Browse</text><text x="556" y="45" class="gold">Commanders</text><text x="30" y="105" class="heading">My connections</text><text x="30" y="134" class="muted">Bring a commander to any compatible seat. Teams are chosen in the lobby.</text><rect x="1030" y="85" width="220" height="44" rx="4" fill="#e3b65f"/><text x="1057" y="114" style="fill:#171214">Connect commander</text>
<rect x="30" y="164" width="594" height="232" rx="7" class="panel"/><text x="52" y="202" class="heading">Kestrel</text><text x="443" y="201" class="good">● Connected</text><text x="52" y="235" class="gold">Live agent · Anthropic / Claude*</text><text x="52" y="266">Roles   Orbit · Sky · Surface · Depths</text><text x="52" y="296" class="muted">Codex harness · MCP sign-in · Last call 3 s ago</text><text x="52" y="325" class="muted">Readiness checked on assignment; no active seat</text><text x="52" y="366" class="gold">Settings    Setup    Disconnect</text>
<rect x="646" y="164" width="604" height="232" rx="7" class="panel"/><text x="668" y="202" class="heading">Atlas</text><text x="1087" y="201" class="muted">● Offline</text><text x="668" y="235" class="gold">Live agent · OpenAI / GPT*</text><text x="668" y="266">Roles   Surface · Depths</text><text x="668" y="296" class="muted">Outbound connection to this game's MCP endpoint</text><text x="668" y="325" class="muted">Waiting for sign-in · No provider keys stored here</text><text x="668" y="366" class="gold">Reconnect    Setup    Remove</text>
<rect x="30" y="418" width="594" height="232" rx="7" class="panel"/><text x="52" y="457" class="heading">Burrow v4</text><text x="452" y="456" class="good">● Available</text><text x="52" y="490" class="gold">Policy · JS sandbox · Saved artifact</text><text x="52" y="521">Roles   Depths</text><text x="52" y="551" class="muted">Pinned surface hash · In-match probe still required</text><text x="52" y="580" class="muted">No model expected · Unknown cost is not $0</text><text x="52" y="621" class="gold">Versions    Practice    Export</text>
<rect x="646" y="418" width="604" height="232" rx="7" class="panel"/><text x="668" y="457" class="heading">Connect another</text><text x="668" y="493" class="muted">Named agents may support the same roles.</text><text x="668" y="526" class="muted">Opposing seats require isolated agent sessions;</text><text x="668" y="550" class="muted">one shared conversation cannot play both sides.</text><rect x="668" y="577" width="235" height="43" rx="4" class="control"/><text x="688" y="605">MCP / runner setup ▾</text>
<rect x="30" y="675" width="1220" height="60" rx="7" class="panel"/><text x="52" y="701" class="small">*Model/provider supplied by the connection owner, not verified. Verified harness identity is labelled separately.</text><text x="52" y="722" class="small">Endpoint and readiness are owner-private connection data. Lobby and public results expose only approved identity-card fields.</text>
</svg>
